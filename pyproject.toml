[project]
name = "veriqon"
version = "0.1.0"
description = "AI-enabled, tenant-configurable quality operations platform."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<2",
    "mcp>=1.9,<2",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=5,<7",
    "regex>=2024.5.15",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qc_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
