name: veriqon

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qc_platform
      POSTGRES_USER: qc_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qc-platform-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc_platform -d qc_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      QC_ENV: production
      DATABASE_URL: postgresql+psycopg://qc_platform:${POSTGRES_PASSWORD:-qc-platform-local}@db:5432/qc_platform
      QC_UI_ORIGINS: ${QC_UI_ORIGINS:-http://localhost:8001,http://127.0.0.1:8001}
    command: ["sh", "-c", "/app/.venv/bin/alembic upgrade head && /app/.venv/bin/uvicorn qc_platform.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      QC_ENV: production
      DATABASE_URL: postgresql+psycopg://qc_platform:${POSTGRES_PASSWORD:-qc-platform-local}@db:5432/qc_platform
    command: ["/app/.venv/bin/python", "-m", "qc_platform.worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    environment:
      API_ORIGIN: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${UI_PORT:-8001}:8001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: qcplatform_postgres_data
